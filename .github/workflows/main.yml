name: Build Zombie Adventure APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download project
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install build tools
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip openjdk-17-jdk \
        python3-pip python3-setuptools \
        autoconf libtool pkg-config \
        zlib1g-dev libncurses-dev \
        libtinfo6 cmake libffi-dev \
        libssl-dev
      python -m pip install --upgrade pip
      python -m pip install buildozer cython==0.29.36

  - name: Build Android APK
    working-directory: Zombie_Adventure_Android
    run: buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Zombie-Adventure-Android-APK
      path: Zombie_Adventure_Android/bin/*.apk
      if-no-files-found: error
